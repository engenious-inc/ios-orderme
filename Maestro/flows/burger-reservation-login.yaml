appId: com.assesment.orderme
---
- launchApp:
    clearState: true
    arguments:
      BASE_URL: http://127.0.0.1:8080
      IS_E2E: true
- tapOn: "Login Later"
- scroll
- tapOn: "Burger"
- assertVisible: "Reservation"
- tapOn: "Reservation"
- assertVisible: "Book"
- tapOn: "Phone number"
- inputRandomNumber
- tapOn: "Number of people"
- inputText: "4"
- tapOn: "Book"
- runFlow:
    when:
        visible: "You did not login"
    commands:
        - tapOn: "Login"
- assertVisible: " Continue with Facebook"
