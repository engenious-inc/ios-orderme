appId: com.assesment.orderme
onFlowStart:
  - runFlow: ../helpers/_bootstrap.yaml
---
- runFlow: ../subflows/screens/login/login-later.yaml
- runFlow: ../subflows/screens/restaurants/select-burger.yaml
- runFlow: ../subflows/table-reservation.yaml

- runFlow:
    when:
      visible: "You did not login"
    commands:
      - tapOn: "Login"

- assertVisible: " Continue with Facebook"
