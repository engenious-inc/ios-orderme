appId: com.assesment.orderme
---
- launchApp:
    clearState: true
    arguments:
      BASE_URL: http://127.0.0.1:8080
      IS_E2E: true
- tapOn:
    id: "loginLaterButton"
- tapOn:
    id: "Beauty & Essex"
- tapOn: "Detect table"
- tapOn:
    id: "tableNumberTextField"
- inputText: "4"
- tapOn: "Select table"
- assertVisible: "Table #4"
